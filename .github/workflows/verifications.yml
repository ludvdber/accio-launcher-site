name: Vérifications

# Le site n'a pas d'étape de compilation : ce qui est poussé part en ligne tel
# quel. Ces tests sont le seul filet avant la mise en production.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    name: Tests du site
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Lancer les tests
        run: node --test "tests/*.test.mjs"
