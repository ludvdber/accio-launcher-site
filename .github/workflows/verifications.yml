name: Vérifications

# Le site n'a pas d'étape de compilation : ce qui est poussé part en ligne tel
# quel. Ces tests sont le seul filet avant la mise en production.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    name: Tests du site
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'

      - name: Lancer les tests
        run: node --test "tests/*.test.mjs"
