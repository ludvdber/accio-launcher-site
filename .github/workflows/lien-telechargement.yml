name: Lien de téléchargement

# Ce lien peut casser sans qu'on touche au site : il suffit que l'exécutable
# change de nom dans une sortie du launcher. Contrôle hebdomadaire.

on:
  schedule:
    - cron: '0 6 * * 1' # tous les lundis, 6 h UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lien:
    name: Le bouton pointe-t-il toujours sur un fichier ?
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'

      - name: Vérifier la dernière version publiée
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node tests/distant.mjs
